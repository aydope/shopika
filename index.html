<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>ShopiKa | Loud Streetwear and Futuristic Merch</title>
    <meta
      name="description"
      content="ShopiKa: bold streetwear, shoes, watches and accessories. Free shipping over $150 and 30-day returns."
    />
    <meta name="theme-color" content="#050505" />
    <link rel="canonical" href="https://shopika.example/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShopiKa | Loud Streetwear" />
    <meta property="og:description" content="Limited-drop merch from the future." />
    <meta property="og:url" content="https://shopika.example/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Unbounded:wght@600;900&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "Organization", "name": "ShopiKa", "url": "https://shopika.example/" },
          {
            "@type": "WebSite",
            "name": "ShopiKa",
            "url": "https://shopika.example/",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://shopika.example/shop?q={q}",
              "query-input": "required name=q"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
